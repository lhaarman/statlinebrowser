<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <style>
        body { color: var(--vscode-foreground); font-family: var(--vscode-font-family); padding: 10px; }
        .input-group { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); }
        button { margin-top: 10px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; padding: 8px 12px; cursor: pointer; }
        #data-view { margin-top: 20px; overflow-x: auto; }
        #status { margin-top: 20px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid var(--vscode-panel-border); padding: 8px; text-align: left; }
        
        /* Checkbox filter container styles */
        .filter-box {
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border);
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
            margin-top: 5px;
            border-radius: 2px;
        }
        .filter-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
            cursor: pointer;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>CBS Statline OData Browser</h1>
    
    <div class="input-group">
        <label for="table-id">Enter Table ID:</label>
        <input type="text" id="table-id" placeholder="e.g. 83583NED">
        <button id="fetch-properties-btn">Fetch Table Properties</button>  <button id="fetch-table-btn">Fetch Table</button>
        <button id="browse-catalog-btn" style="background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground);">Browse Table Catalog</button>
    </div>
    <div id="catalog-container" style="margin-bottom: 20px; display: none;">
        <label for="catalog-search" style="font-weight: bold; font-size: 0.9em;">Search Tables:</label>
        <input type="text" id="catalog-search" placeholder="Type to filter tables...">
        <select id="catalog-select" size="6" style="width: 100%; margin-top: 5px; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); padding: 5px; box-sizing: border-box;"></select>
        <button id="select-table-btn">Use Selected Table</button>
    </div>
    <div id="filter-container"></div>
    <h2 id="table-title" style="margin-top: 20px;"></h2>
    <div id="status"></div>
    <div id="data-view"></div>
    <script nonce="{{nonce}}">
        const vscode = acquireVsCodeApi();
        let allTables = [];

        window.addEventListener("DOMContentLoaded", () => {
            vscode.postMessage({ command: "DOMContentLoaded" });
            // Fetch catalog eagerly in the background
            vscode.postMessage({ command: "fetchCatalog" });
        });

        document.getElementById('browse-catalog-btn').addEventListener('click', () => {
            const container = document.getElementById('catalog-container');
            const btn = document.getElementById('browse-catalog-btn');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                btn.textContent = 'Close Table Catalog';
                // If tables aren't loaded yet, show loading status
                if (allTables.length === 0) {
                    document.getElementById('status').innerHTML = '<p>Fetching table catalog...</p>';
                }
            } else {
                container.style.display = 'none';
                btn.textContent = 'Browse Table Catalog';
            }
        });

        document.getElementById('catalog-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const select = document.getElementById('catalog-select');
            select.innerHTML = '';
            
            const filtered = allTables.filter(t => 
                t.Identifier.toLowerCase().includes(query) || 
                (t.Title && t.Title.toLowerCase().includes(query)) ||
                (t.ShortDescription && t.ShortDescription.toLowerCase().includes(query))
            );

            filtered.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.Identifier;
                opt.textContent = `${t.Identifier}: ${t.Title}`;
                select.appendChild(opt);
            });
        });

        document.getElementById('select-table-btn').addEventListener('click', () => {
            const select = document.getElementById('catalog-select');
            if (select.value) {
                const tableId = select.value;
                document.getElementById('table-id').value = tableId;
                document.getElementById('catalog-container').style.display = 'none';
                document.getElementById('browse-catalog-btn').textContent = 'Browse Table Catalog';
                
                // Automatically fetch properties/options for the selected table
                document.getElementById('status').innerHTML = '<p>Fetching properties data...</p>';
                vscode.postMessage({
                    command: 'fetchOptions',
                    tableId: tableId
                });
            }
        });

        document.getElementById('fetch-properties-btn').addEventListener('click', () => {
            const tableId = document.getElementById('table-id').value;
            if (tableId) {
                document.getElementById('status').innerHTML = '<p>Fetching properties data...</p>';

                vscode.postMessage({
                    command: 'fetchOptions',
                    tableId: tableId
                });
            }
        });
        
        document.getElementById('fetch-table-btn').addEventListener('click', () => {
            const tableId = document.getElementById('table-id').value;
            if (tableId) {
                document.getElementById('status').innerHTML = '<p>Fetching data...</p>';
                document.getElementById('table-title').textContent = ''; // Clear previous title

                // Try to find the title from our loaded catalog, otherwise fallback to Table ID
                const matchedTable = allTables.find(t => t.Identifier === tableId);
                const displayTitle = matchedTable ? `${matchedTable.Title}` : `Table: ${tableId}`;
                
                // Store title to display when rendered
                window.pendingTableTitle = displayTitle;

                const selectedFilters = {};
                const selectedTopics = [];
                // Find all checked checkboxes inside our filter container
                const checkedBoxes = document.querySelectorAll("#filter-container input[type='checkbox']:checked");

                checkedBoxes.forEach(checkbox => {
                    const name = checkbox.getAttribute("name");
                    const filterName = name.replace("filter-", "");
                    
                    if (filterName === "Topics") {
                        selectedTopics.push(checkbox.value.split(':')[0]);
                    } else {
                        if (!selectedFilters[filterName]) {
                            selectedFilters[filterName] = [];
                        }
                        selectedFilters[filterName].push(checkbox.value.split(':')[0]);
                    }
                });

                vscode.postMessage({
                    command: 'fetchTable',
                    tableId: tableId,
                    selectedFilters: selectedFilters,
                    selectedTopics: selectedTopics
                });
            }
        });

        // Whenever any checkbox is clicked/changed:
        document.getElementById('filter-container').addEventListener('change', () => {
            const selectedFilters = {};
            const selectedTopics = [];
            const checkedBoxes = document.querySelectorAll('#filter-container input[type="checkbox"]:checked');

            checkedBoxes.forEach(checkbox => {
                const name = checkbox.getAttribute('name');
                const filterName = name.replace('filter-', '');
                const value = checkbox.value;
                
                if (filterName === 'Topics') {
                    selectedTopics.push(value);
                } else {
                    if (!selectedFilters[filterName]) {
                        selectedFilters[filterName] = [];
                    }
                    selectedFilters[filterName].push(value);
                }
            });

            // Send the updated selections to the extension immediately
            vscode.postMessage({
                command: 'saveSelectedFilters',
                selectedFilters: selectedFilters,
                selectedTopics: selectedTopics
            });
        });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'renderTable') {
                document.getElementById('data-view').innerHTML = message.html;
                if (window.pendingTableTitle) {
                    document.getElementById('table-title').textContent = window.pendingTableTitle;
                }
            } else if (message.command === "setTableId") {
                document.getElementById("table-id").value = message.value;
            } else if (message.command === "renderCatalog") {
                allTables = message.tables || [];
                document.getElementById('status').innerHTML = '';
                const select = document.getElementById('catalog-select');
                select.innerHTML = '';
                allTables.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.Identifier;
                    opt.textContent = `${t.Identifier}: ${t.Title}`;
                    select.appendChild(opt);
                });
            } else if (message.command === "renderFilters") {
                const container = document.getElementById('filter-container');
                container.innerHTML = '<h3>Filters</h3>';
                
                // Create a wrapper for horizontal layout
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexWrap = 'wrap';
                wrapper.style.gap = '15px';

                message.filters.forEach(filter => {
                    const div = document.createElement('div');
                    div.style.minWidth = '180px';
                    div.style.flex = '1';

                    const checkboxesHtml = filter.options.map(opt => `
                        <label class="filter-option">
                            <input type="checkbox" name="filter-${filter.name}" value="${opt}">
                            <span>${opt}</span>
                        </label>
                    `).join('');

                    div.innerHTML = `
                        <label style="display:block; font-size: 0.85em; font-weight: bold; margin-bottom: 2px;">${filter.name}</label>
                        <div class="filter-box">
                            ${checkboxesHtml}
                        </div>
                    `;
                    wrapper.appendChild(div);
                });
                
                container.appendChild(wrapper);
                document.getElementById('status').innerHTML = '';

                // Always automatically fetch the table data once filters are rendered
                const tableId = document.getElementById('table-id').value;
                if (tableId) {
                    document.getElementById('status').innerHTML = '<p>Fetching data...</p>';
                    
                    const selectedFilters = {};
                    const selectedTopics = [];
                    const checkedBoxes = document.querySelectorAll("#filter-container input[type='checkbox']:checked");

                    checkedBoxes.forEach(checkbox => {
                        const name = checkbox.getAttribute("name");
                        const filterName = name.replace("filter-", "");
                        
                        if (filterName === "Topics") {
                            selectedTopics.push(checkbox.value.split(':')[0]);
                        } else {
                            if (!selectedFilters[filterName]) {
                                selectedFilters[filterName] = [];
                            }
                            selectedFilters[filterName].push(checkbox.value.split(':')[0]);
                        }
                    });

                    vscode.postMessage({
                        command: 'fetchTable',
                        tableId: tableId,
                        selectedFilters: selectedFilters,
                        selectedTopics: selectedTopics
                    });
                }
            } else if (message.command === "setSelectedFilters") {
                const savedSelections = message.selectedFilters || {};
                const savedTopics = message.selectedTopics || [];
                
                // Check saved dimensions
                for (const [filterName, values] of Object.entries(savedSelections)) {
                    values.forEach(val => {
                        const checkbox = document.querySelector(`input[name="filter-${filterName}"][value="${val}"]`);
                        if (checkbox) {
                            checkbox.checked = true;
                        }
                    });
                }
                
                // Check saved topics
                savedTopics.forEach(val => {
                    const checkbox = document.querySelector(`input[name="filter-Topics"][value="${val}"]`);
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                });
            } else if (message.command === "updateStatus") {
                document.getElementById('status').innerHTML = `<p>${message.status}</p>`;
            }
        });
    </script>
</body>
</html>
